services:

  ibkr-gateway:
    image: gnzsnz/ib-gateway:stable
    restart: always
    container_name: ${PROJECT_NAME}-gateway
    environment:
      - TWS_USERID=${IB_USER}
      - TWS_PASSWORD=${IB_PASS}
      - TRADING_MODE=${MODE}
      - VNC_SERVER_PASSWORD=${VNC_PASS}
      - READ_ONLY_API=${READ_ONLY_API}
      - TWOFA_TIMEOUT_ACTION=${TWOFA_TIMEOUT_ACTION}
      - AUTO_RESTART_TIME=${AUTO_RESTART_TIME}
      - TWS_COLD_RESTART=${TWS_COLD_RESTART}
      - RELOGIN_AFTER_TWOFA_TIMEOUT=${RELOGIN_AFTER_TWOFA_TIMEOUT}
      - EXISTING_SESSION_DETECTED_ACTION=${EXISTING_SESSION_DETECTED_ACTION}
      - ALLOW_BLIND_TRADING=${ALLOW_BLIND_TRADING}
      - TZ=${TZ}
      - TIME_ZONE=${TZ}
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '< /dev/tcp/localhost/${IB_PORT}' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - ibkr

  ibkr-db:
    image: mariadb:12.3.2
    restart: always
    container_name: ${PROJECT_NAME}-db
    command: --default-time-zone=${TZ}
    environment:
      TZ: ${TZ}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:33${PROJECT_ID}:3306"
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${DB_USER}", "--password=${DB_PASS}" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - ibkr

  ibkr-api:
    build: .
    image: ibkr-app:latest
    restart: always
    container_name: ${PROJECT_NAME}-api
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - TZ=${TZ}
      - PROJECT_NAME=${PROJECT_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - IB_PORT=${IB_PORT}
      - IB_CLIENT_ID=${IB_CLIENT_ID}
      - API_KEY=${API_KEY}
      - DB_URL=mysql+pymysql://${DB_USER}:${DB_PASS}@${PROJECT_NAME}-db/${DB_NAME}
    depends_on:
      ibkr-db:
        condition: service_healthy
      ibkr-gateway:
        condition: service_healthy
    networks:
      - traefik
      - ibkr
    volumes:
      - ./src:/app/src
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${PROJECT_NAME}-api.loadbalancer.server.port=8000"

  ibkr-bot:
    image: ibkr-app:latest
    restart: always
    container_name: ${PROJECT_NAME}-bot
    user: "${USER_ID}:${GROUP_ID}"
    command: python -m src.bot
    environment:
      - TZ=${TZ}
      - PROJECT_NAME=${PROJECT_NAME}
      - TELEGRAM_TOKEN=${TG_TOKEN}
      - TELEGRAM_ALLOWED_IDS=${TG_ALLOWED_IDS}
      - API_KEY=${API_KEY}
      - DB_URL=mysql+pymysql://${DB_USER}:${DB_PASS}@${PROJECT_NAME}-db/${DB_NAME}
      - CASH_DIFFERENCE_CHECK_INTERVAL=${CASH_DIFFERENCE_CHECK_INTERVAL}
      - DELTA_ALERT_TIMES=${DELTA_ALERT_TIMES}
      - DELTA_ALERT_THRESHOLD=${DELTA_ALERT_THRESHOLD}
      - DB_INSERT_INTERVAL=${DB_INSERT_INTERVAL}
      - IB_FLEX_TOKEN=${IB_FLEX_TOKEN}
      - IB_FLEX_DAILY_QUERY_ID=${IB_FLEX_DAILY_QUERY_ID}
      - IB_FLEX_MONTHLY_QUERY_ID=${IB_FLEX_MONTHLY_QUERY_ID}
      - IB_FLEX_TOKEN_EXPIRY=${IB_FLEX_TOKEN_EXPIRY}
      - IB_FLEX_SCHEDULE_TIME=${IB_FLEX_SCHEDULE_TIME}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
    volumes:
      - ./src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - ./flex_queries:/app/flex_queries
    depends_on:
      ibkr-db:
        condition: service_healthy
      ibkr-api:
        condition: service_started
    networks:
      - ibkr

networks:
  traefik:
    external: true
  ibkr:
    driver: bridge
